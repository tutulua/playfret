<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0d0f">
  <meta name="description" content="PlayFret: aprende guitarra, acorde a acorde.">
  <title>Smoke on the Water — PlayFret</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/guitar.css">
  <script src="js/LessonEngine.js" defer></script>
  <script src="js/FingerAssignmentEngine.js" defer></script>
  <script src="js/guitar.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="practice-layout">
    <header class="lesson-header" aria-labelledby="lesson-title">
      <div class="lesson-heading">
        <span class="lesson-heading__eyebrow">LECCIÓN 04</span>
        <h1 id="lesson-title">Smoke on the Water</h1>
        <p>Deep Purple · Riff principal</p>
      </div>
      <dl class="lesson-stats" aria-label="Estado de la lección">
        <div>
          <dt>Velocidad</dt>
          <dd>1.0<small>×</small></dd>
        </div>
        <div>
          <dt>Progreso</dt>
          <dd class="lesson-progress">72<small>%</small></dd>
        </div>
      </dl>
    </header>

    <section class="fretboard-stage" aria-label="Área de práctica">
      <div class="fretboard-wrap" data-fretboard aria-label="Diagrama del mástil de guitarra"></div>
    </section>

    <footer class="control-dock">
      <section class="player-panel" aria-label="Controles de reproducción">
        <div class="transport-controls">
          <button class="skip-button" type="button" aria-label="Paso anterior">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14M19 6l-9 6 9 6V6Z"/></svg>
          </button>
          <button class="play-button" type="button" aria-label="Comenzar lección">
            <svg viewBox="0 0 28 28" aria-hidden="true"><path d="m9 5 14 9-14 9V5Z"/></svg>
          </button>
          <button class="skip-button" type="button" aria-label="Paso siguiente">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14M5 6l9 6-9 6V6Z"/></svg>
          </button>
        </div>
      </section>

      <details class="options-menu">
        <summary>Opciones</summary>
        <fieldset class="guide-options">
          <legend>Ayudas visuales</legend>
          <label><input type="checkbox" checked><span aria-hidden="true"></span>Mano</label>
          <label><input type="checkbox" data-show-guide-point><span aria-hidden="true"></span>Punto</label>
          <label><input type="checkbox" checked><span aria-hidden="true"></span>Trastes</label>
          <label><input type="checkbox" checked><span aria-hidden="true"></span>Notas</label>
        </fieldset>
      </details>
    </footer>
  </main>
</body>
</html>
